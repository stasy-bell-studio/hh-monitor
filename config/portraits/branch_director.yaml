  osago_knowledge: 9
  target_region_primary: 8
  target_region_adjacent: 4   # берём max(primary, adjacent), не сумму
  ifl_experience: 7
  top4_competitor_experience: 6
  higher_specialized_education: 5
  # Backward compat (старые rules.py — больше не используются в scoring):
  title_match: 25
  experience_keywords: 15
  total_experience: 20
  salary_fit: 10
  education: 5
  region: 10
  age: 5

