position_code: branch_director
position_name: "Директор филиала"

position_description: |
  Руководитель регионального филиала страховой компании "21 Век".
  Отвечает за P&L филиала, KPI агентской сети, объём собранной
  премии, открытие/закрытие точек, retention агентов. Прямое
  подчинение коммерческому или генеральному директору.
  Управленческая роль, не индивидуальный вклад. Фокус — моторные
  виды (КАСКО, ОСАГО) + ИФЛ (квартиры/дома).

# Пусто — LLM выведёт критерии из position_description
evaluation_focus: []

position_synonyms:
  # Короткие формы — идут первыми чтобы вписаться в лимит 255 символов
  - Руководитель филиала
  - Управляющий филиалом
  - Начальник филиала
  # Региональные формы перемещены выше Директор/Руководитель регионального офиса
  # — они чаще встречаются в insurance и важны для охвата
  - Региональный директор
  - Региональный управляющий
  - Директор регионального офиса
  - Руководитель регионального офиса
  - Управляющий представительства
  - Директор представительства
  - Руководитель представительства
  - Менеджер филиала

