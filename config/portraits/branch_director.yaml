position_code: branch_director
position_name: "Директор филиала"

position_description: |
  Директор филиала страховой компании среднего размера (Поволжский регион).
  Полная P&L-ответственность за филиал: управление агентской сетью (50–200 агентов
  и сотрудников), выполнение плана по страховым сборам, контроль убыточности,
  подбор и развитие персонала, взаимодействие с головным офисом.
  Основной канал продаж — агентский (физлица и юрлица); в меньшей степени —
  прямые корпоративные продажи и партнёрский канал (банки, автодилеры).
  Ключевые продукты: ОСАГО, КАСКО, имущество, страхование жизни (рисковое).

evaluation_focus:
  - "Управление агентской сетью: размер сети, динамика роста, KPI по сборам"
  - "P&L-опыт: был ли кандидат реально ответствен за прибыль/убыточность филиала"
  - "Экспертиза в B2C-страховании: понимание продуктов ОСАГО/КАСКО/имущество"
  - "Лидерский трек: сколько людей в прямом подчинении, что построил с нуля"
  - "Регион и рынок: знание Поволжского рынка, связи с агентами и партнёрами"
  - "Стабильность и рост: нет ли частых перемещений без карьерного прогресса"

