critic_lens: |
  СТОП-КОМПАНИИ: Капитал Лайф, Росгосстрах-Жизнь, ВТБ Страхование, Сбербанк Страхование, Ренессанс Жизнь — чисто лайфовые компании без моторных видов. Опыт там не считается профильным для данной вакансии.
  ЧАСТЫЕ СМЕНЫ: более 3 позиций за последние 3 года — красный флаг нестабильности; уточнять причины каждого перехода.
  ДМС БЕЗ МОТОРНЫХ ВИДОВ: опыт только в ДМС/медицинском страховании без КАСКО/ОСАГО — не дисквалификация, но флаг: кандидат не знает моторную специфику, обучение с нуля.
  БАНК/ЛИЗИНГ В ПОСЛЕДНЕЙ РОЛИ: текущая должность в банке или лизинговой компании (даже с «андеррайтер» в title) — скорее всего кредитный андеррайтинг, не страховой; проверять внимательно.
  ТАРИФНЫЕ ПРОЕКТЫ: нет ни одного упоминания разработки/пересмотра тарифов, тарифных моделей или актуарных расчётов — слабый андеррайтер-техник; уточнять реальную глубину экспертизы.
