position_code: underwriter
position_name: "Андеррайтер (21 Век)"

position_description: |
  Андеррайтер по моторным видам страхования (КАСКО, ОСАГО) страховой компании "21 Век".
  Оценивает страховые риски, разрабатывает тарифы, согласует условия страхования,
  верифицирует страховые заявки. Требуется глубокая экспертиза в автостраховании.

