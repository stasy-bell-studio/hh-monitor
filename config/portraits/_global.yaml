# Глобальный контекст insurance-рынка РФ для HR-промптов.
# Меняется редко (раз в год / при крупных M&A на рынке).

target_companies:
  - Росгосстрах
  - Ингосстрах
  - Ресо-Гарантия
  - Альфа-Страхование
  - ВСК
  - Югория
  - Зетта Страхование
  - Гелиос
  - Астро-Волга
  - СОГАЗ
  - Согласие
  - МАКС
  - Энергогарант

stop_companies:
  - Капитал Лайф Страхование Жизни

market_context: |
  Целевые компании выше — основные игроки B2C-страхования на рынке
  РФ. Переход кандидата из них в нашу компанию — нейтрально-
  позитивный сигнал (понимает специфику отрасли).

  Опасные источники найма (red flag для большинства insurance-
  позиций):
  - Банки (другая логика продаж: транзакционная vs. retention).
  - Автосалоны / автодилеры (продажа КАСКО как нагрузки — не
    реальный insurance-опыт).
  - Лизинговые компании.
  - МФО / коллекшн.

  Стоп-компании — текущее место работы там автоматически даёт
  verdict="стоп-сигнал" независимо от остального резюме.
