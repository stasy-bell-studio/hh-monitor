# Глобальный контекст insurance-рынка РФ для HR-промптов.
# Меняется редко (раз в год / при крупных M&A на рынке).
# Обновлено в сессии 5.7 по эталону Лесницкой v1: 9 компаний (было 13).

target_companies:
  - Астро-Волга
  - Росгосстрах
  - Зетта Страхование
  - Югория
  - Ресо-Гарантия
  - Альфа-Страхование
  - ВСК
  - Ингосстрах
  - Гелиос

stop_companies:
  - Капитал Лайф Страхование Жизни

market_context: |
  9 целевых компаний выше — основные игроки B2C-страхования в РФ,
  к которым компания-заказчик "21 Век" относится с уважением.
  Переход кандидата из них — нейтрально-позитивный сигнал.
  Из них 4 компании (Ресо-Гарантия, Альфа-Страхование, ВСК, Ингосстрах) —
  прямые конкуренты по B2C-моделям и дают буст в fit_score.

  Опасные источники найма (hard-stop для insurance-позиций):
  - Банки (другая логика продаж, иная культура агентских продаж)
  - Автосалоны / автодилеры
  - Лизинговые компании
  - МФО / коллекшн
  Работа в этих отраслях в последнем месте работы =
  verdict="стоп-сигнал" безусловно.
