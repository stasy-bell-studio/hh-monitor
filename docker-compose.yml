services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hh_monitor
      POSTGRES_PASSWORD: hh_monitor_dev
      POSTGRES_DB: hh_monitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hh_monitor -d hh_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
